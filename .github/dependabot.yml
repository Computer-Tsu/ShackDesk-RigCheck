#
# File    : .github/dependabot.yml
# Purpose : Dependabot opens pull requests when NuGet packages or GitHub
#           Actions have newer versions, and patches known vulnerabilities
#           without manual monitoring.
#
# Schedule : Weekly, Monday mornings (UTC). PRs target the develop branch.
# Labels   : "dependencies", "automated" — filter Dependabot PRs by these.
# ──────────────────────────────────────────────────────────────────────────────
version: 2

updates:
  # NuGet packages (Serilog, CommunityToolkit.Mvvm, Newtonsoft.Json, etc.)
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions (actions/checkout, actions/setup-dotnet, etc.)
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(actions)"
