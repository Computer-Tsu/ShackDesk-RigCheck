# License : GPLv3 (see LICENSE)
#
# Workflow : CodeQL Security Analysis
# Purpose  : Static analysis of the C# source for security and quality
#            issues. Findings appear under the repository's Security tab.
#
# Triggers :
#   - push to develop or main    — analyze the new code
#   - pull_request               — analyze before merge
#   - schedule (weekly, Monday)  — catch newly published query rules
#   - workflow_dispatch          — manual run
#
# CodeQL must observe the build to trace C#, so the init step runs before
# dotnet build rather than after.
# ──────────────────────────────────────────────────────────────────────────────
name: CodeQL

on:
  push:
    branches: [ develop, main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/SECURITY.md'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ develop, main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/SECURITY.md'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT:        'RigCheck.csproj'

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest

    permissions:
      actions:         read
      contents:        read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build for analysis
        run: dotnet build ${{ env.PROJECT }} --configuration Debug --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:csharp'
