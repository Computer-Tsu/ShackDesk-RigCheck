# ──────────────────────────────────────────────────────────────────────────────
# RigCheck by ShackDesk
# Project : https://github.com/Computer-Tsu/ShackDesk-RigCheck
# Author  : Mark McDow (N4TEK) — My Computer Guru LLC
# License : GPLv3 (see LICENSE)
#
# Workflow : Build
# Purpose  : Compiles RigCheck and publishes the self-contained Windows
#            executable as a workflow artifact. This is the project's only
#            build path — there is no local toolchain.
#
# Triggers :
#   - push to develop or main      — build and publish exe artifact
#   - pull_request                 — build only
#   - workflow_dispatch (manual)   — build; optionally publish the exe artifact
#
# Channel  : develop → alpha (30-day expiry), main → stable. The channel and
#            the UTC build date are passed to MSBuild and stamped into the
#            assembly; BuildInfo.cs reads them at runtime.
#
# Artifact : RigCheck-{version}-{channel}-{yyyyMMdd}-{sha7}.exe plus .sha256
#
# Manual trigger : Actions tab → "Build" → "Run workflow" → select branch
# ──────────────────────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches: [ develop, main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/SECURITY.md'
  pull_request:
    branches: [ develop, main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/SECURITY.md'
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: 'Publish and upload RigCheck.exe artifact'
        required: false
        default: true
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT:        'RigCheck.csproj'
  RID:            'win-x64'
  APP_EXE:        'RigCheck.exe'

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine channel, version, and build date
        id: meta
        shell: pwsh
        run: |
          $channel = if ('${{ github.ref }}' -eq 'refs/heads/main') { 'stable' } else { 'alpha' }
          $version = (Select-String -Path '${{ env.PROJECT }}' -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $date    = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          $stamp   = [DateTime]::UtcNow.ToString('yyyyMMdd')
          $sha     = '${{ github.sha }}'.Substring(0, 7)
          $name    = if ($channel -eq 'stable') { "RigCheck-$version" } else { "RigCheck-$version-$channel-$stamp-$sha" }
          "channel=$channel"   >> $env:GITHUB_OUTPUT
          "version=$version"   >> $env:GITHUB_OUTPUT
          "date=$date"         >> $env:GITHUB_OUTPUT
          "name=$name"         >> $env:GITHUB_OUTPUT
          Write-Host "Channel: $channel  Version: $version  Built: $date  Artifact: $name"

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build — Release
        run: >
          dotnet build ${{ env.PROJECT }}
          --configuration Release
          --no-restore
          -p:Channel=${{ steps.meta.outputs.channel }}
          -p:BuildDateUtc=${{ steps.meta.outputs.date }}

      - name: Publish — single self-contained exe
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_artifact) }}
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime ${{ env.RID }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Channel=${{ steps.meta.outputs.channel }}
          -p:BuildDateUtc=${{ steps.meta.outputs.date }}
          --output ./publish

      - name: Name the exe and compute SHA-256
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_artifact) }}
        shell: pwsh
        run: |
          $name = '${{ steps.meta.outputs.name }}'
          Rename-Item './publish/${{ env.APP_EXE }}' "$name.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "./publish/$name.exe").Hash.ToLower()
          "$hash  $name.exe" | Out-File -FilePath "./publish/$name.exe.sha256" -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Upload exe artifact
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_artifact) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            ./publish/${{ steps.meta.outputs.name }}.exe
            ./publish/${{ steps.meta.outputs.name }}.exe.sha256
